services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mtia
      POSTGRES_PASSWORD: mtia
      POSTGRES_DB: mtia
    ports:
      - "5435:5432"
    volumes:
      - mtia_postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtia -d mtia"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://mtia:mtia@db:5432/mtia
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_NAME: trial_ingestion
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mtia_postgres_data:
