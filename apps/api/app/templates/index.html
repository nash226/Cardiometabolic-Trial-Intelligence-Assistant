<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTIA Trial Review</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-alt: #f1f5f4;
      --ink: #172126;
      --muted: #5d6b74;
      --line: #d8e0e5;
      --accent: #12736a;
      --accent-dark: #0b564f;
      --accent-soft: #dff1ee;
      --warn: #8a4b12;
      --warn-bg: #fff6e8;
      --warn-line: #edc98f;
      --shadow: 0 16px 36px rgba(32, 51, 63, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: var(--accent);
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: grid;
      gap: 4px;
    }

    .brand span {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(1.85rem, 4vw, 3.2rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .status {
      min-width: 108px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    .query-panel {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    label {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 108px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      color: var(--ink);
      font: inherit;
      line-height: 1.5;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(18, 115, 106, 0.14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .secondary {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--accent-dark);
    }

    .secondary:hover {
      background: var(--surface-alt);
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.78fr);
      gap: 18px;
      margin-top: 18px;
      align-items: start;
    }

    .panel {
      display: grid;
      gap: 14px;
      min-height: 260px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h2 {
      margin-bottom: 0;
      font-size: 1.05rem;
    }

    .count {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .result-card,
    .evidence-card {
      display: grid;
      gap: 9px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .card-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: baseline;
      justify-content: space-between;
    }

    .nct {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .score {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .title {
      margin-bottom: 0;
      font-size: 1rem;
      line-height: 1.35;
    }

    .snippet,
    .answer-text {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .answer-text {
      color: var(--ink);
      white-space: pre-wrap;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .text-link {
      width: fit-content;
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .empty,
    .warning {
      padding: 14px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .empty {
      border: 1px dashed var(--line);
      background: #fbfcfd;
      color: var(--muted);
    }

    .warning {
      border: 1px solid var(--warn-line);
      background: var(--warn-bg);
      color: var(--warn);
    }

    .answer-panel {
      position: sticky;
      top: 16px;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .answer-panel {
        position: static;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 24px, 1180px);
        padding-top: 18px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        text-align: left;
      }

      .query-panel,
      .panel {
        padding: 14px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span>Metabolic Trial Intelligence Assistant</span>
        <h1>Trial review</h1>
      </div>
      <div class="status" id="workspace-status">Ready</div>
    </header>

    <form class="query-panel" id="query-form">
      <label for="query">Question or search terms</label>
      <textarea id="query" name="query" required>Which phase 3 obesity trials in 2026 involve GLP-1 related therapy?</textarea>
      <div class="actions">
        <button type="submit" id="search-button">Search trials</button>
        <button class="secondary" type="button" id="ask-button">Ask with evidence</button>
      </div>
    </form>

    <section class="content-grid">
      <section class="panel" aria-labelledby="results-title">
        <div class="panel-header">
          <h2 id="results-title">Matched trials</h2>
          <span class="count" id="results-count">No query run</span>
        </div>
        <div class="list" id="results-list">
          <div class="empty">Run a search to review matching trials.</div>
        </div>
      </section>

      <aside class="panel answer-panel" aria-labelledby="answer-title">
        <div class="panel-header">
          <h2 id="answer-title">Answer</h2>
          <span class="count" id="answer-method">Idle</span>
        </div>
        <div class="answer-text" id="answer-text">Ask with evidence to generate a cited response from the current corpus.</div>
        <div class="list" id="evidence-list"></div>
      </aside>
    </section>
  </main>

  <script>
    const queryForm = document.getElementById("query-form");
    const queryInput = document.getElementById("query");
    const searchButton = document.getElementById("search-button");
    const askButton = document.getElementById("ask-button");
    const workspaceStatus = document.getElementById("workspace-status");
    const resultsCount = document.getElementById("results-count");
    const resultsList = document.getElementById("results-list");
    const answerText = document.getElementById("answer-text");
    const answerMethod = document.getElementById("answer-method");
    const evidenceList = document.getElementById("evidence-list");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function trialUrl(nctId) {
      return `/trials/${encodeURIComponent(nctId)}`;
    }

    function baseFilters() {
      return {
        condition: null,
        phase: null,
        study_type: null,
        accepted_only: true,
        year_2026_only: true
      };
    }

    function setBusy(isBusy, label) {
      workspaceStatus.textContent = label;
      searchButton.disabled = isBusy;
      askButton.disabled = isBusy;
    }

    function payloadForSearch(limit = 8) {
      return {
        query: queryInput.value.trim(),
        ...baseFilters(),
        limit
      };
    }

    function renderResults(payload) {
      const results = payload.results || [];
      resultsCount.textContent = `${results.length} shown / ${payload.eligible_trial_count ?? 0} eligible`;

      if (!results.length) {
        resultsList.innerHTML = '<div class="empty">No matching trials found for this query.</div>';
        return;
      }

      resultsList.innerHTML = results.map((result) => `
        <article class="result-card">
          <div class="card-top">
            <span class="nct">${escapeHtml(result.trial_nct_id)}</span>
            <span class="score">${escapeHtml(result.chunk_type || "evidence")}</span>
          </div>
          <h3 class="title">${escapeHtml(result.trial_title || result.title || result.chunk_type || "Trial evidence")}</h3>
          <p class="snippet">${escapeHtml(result.snippet)}</p>
          <div class="card-actions">
            <a class="text-link" href="${trialUrl(result.trial_nct_id)}">Open trial detail</a>
          </div>
        </article>
      `).join("");
    }

    function renderEvidence(citations) {
      if (!citations || !citations.length) {
        evidenceList.innerHTML = '<div class="empty">No evidence snippets returned.</div>';
        return;
      }

      evidenceList.innerHTML = citations.slice(0, 4).map((citation) => `
        <article class="evidence-card">
          <div class="card-top">
            <span class="nct">${escapeHtml(citation.trial_nct_id)}</span>
            <span class="score">${escapeHtml(citation.chunk_id)}</span>
          </div>
          <h3 class="title">${escapeHtml(citation.title || citation.chunk_type || "Evidence")}</h3>
          <p class="snippet">${escapeHtml(citation.snippet)}</p>
          <a class="text-link" href="${trialUrl(citation.trial_nct_id)}">Review source trial</a>
        </article>
      `).join("");
    }

    function answerFromSearch(searchPayload, reason) {
      const results = searchPayload.results || [];
      if (!results.length) {
        answerText.textContent = "No evidence was retrieved from the lexical search path.";
        answerMethod.textContent = "No evidence";
        evidenceList.innerHTML = "";
        return;
      }

      const trialIds = [...new Set(results.map((result) => result.trial_nct_id))].slice(0, 4);
      answerText.textContent = [
        reason,
        "",
        `Most relevant trials: ${trialIds.join(", ")}.`,
        "Review the evidence cards and trial detail pages before drawing a final conclusion."
      ].join("\n");
      answerMethod.textContent = "Lexical fallback";
      renderEvidence(results.map((result) => ({
        chunk_id: result.chunk_id,
        trial_nct_id: result.trial_nct_id,
        chunk_type: result.chunk_type,
        title: result.title,
        snippet: result.snippet
      })));
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || `${url} failed`);
      }
      return response.json();
    }

    async function runSearch(event) {
      if (event) event.preventDefault();
      const query = queryInput.value.trim();
      if (!query) return;

      const payload = payloadForSearch();
      setBusy(true, "Searching");
      resultsList.innerHTML = '<div class="empty">Searching the accepted 2026 corpus...</div>';

      try {
        const data = await postJson("/api/v1/search", payload);
        renderResults(data);
        answerMethod.textContent = "Search ready";
        workspaceStatus.textContent = "Ready";
      } catch (error) {
        resultsCount.textContent = "Search failed";
        resultsList.innerHTML = `<div class="warning">${escapeHtml(error.message)}</div>`;
        workspaceStatus.textContent = "Error";
      } finally {
        searchButton.disabled = false;
        askButton.disabled = false;
      }
    }

    async function runAsk() {
      const query = queryInput.value.trim();
      if (!query) return;

      const searchPayload = payloadForSearch();
      setBusy(true, "Asking");
      answerMethod.textContent = "Retrieving";
      answerText.textContent = "Retrieving evidence and generating a grounded response...";
      evidenceList.innerHTML = "";

      try {
        const askPayload = {
          question: query,
          ...baseFilters(),
          retrieval_limit: 5,
          provider: "openai",
          embedding_model: "text-embedding-3-small",
          answer_model: "gpt-4o-mini",
          lexical_weight: 0.45,
          semantic_weight: 0.55
        };
        const data = await postJson("/api/v1/ask", askPayload);
        answerText.textContent = data.answer;
        answerMethod.textContent = data.method === "grounded_llm" ? "Grounded answer" : "Fallback answer";
        renderEvidence(data.citations || []);
        if (data.warnings && data.warnings.length) {
          evidenceList.insertAdjacentHTML(
            "afterbegin",
            data.warnings.map((warning) => `<div class="warning">${escapeHtml(warning)}</div>`).join("")
          );
        }
        workspaceStatus.textContent = "Ready";
      } catch (error) {
        try {
          const searchData = await postJson("/api/v1/search", searchPayload);
          renderResults(searchData);
          answerFromSearch(searchData, "Model-backed answering is unavailable in this environment.");
          evidenceList.insertAdjacentHTML("afterbegin", `<div class="warning">${escapeHtml(error.message)}</div>`);
          workspaceStatus.textContent = "Fallback ready";
        } catch (searchError) {
          answerText.textContent = "The ask request failed, and lexical fallback could not be retrieved.";
          answerMethod.textContent = "Error";
          evidenceList.innerHTML = `<div class="warning">${escapeHtml(searchError.message)}</div>`;
          workspaceStatus.textContent = "Error";
        }
      } finally {
        searchButton.disabled = false;
        askButton.disabled = false;
      }
    }

    queryForm.addEventListener("submit", runSearch);
    askButton.addEventListener("click", runAsk);
  </script>
</body>
</html>
